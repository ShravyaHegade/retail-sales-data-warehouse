
version: 2

models:
  - name: dim_customers
    columns:
      - name: customer_key
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: dim_product
    columns:
      - name: product_key
        data_tests:
          - unique
          - not_null
      - name: product_id
        data_tests:
          - unique
          - not_null

  - name: dim_store
    columns:
      - name: store_key
        data_tests:
          - unique
          - not_null
      - name: store_id
        data_tests:
          - unique
          - not_null

  - name: dim_date
    columns:
      - name: date_key
        data_tests:
          - unique
          - not_null
      - name: date
        data_tests:
          - unique
          - not_null

  - name: dim_payment_method
    columns:
      - name: payment_method_key
        data_tests:
          - unique
          - not_null
      - name: payment_method
        data_tests:
          - unique
          - not_null

  - name: fact_sales
    columns:
      - name: sales_key
        data_tests:
          - unique
          - not_null
      - name: transaction_id
        data_tests:
          - unique
          - not_null
      - name: quantity
        data_tests:
          - not_null
